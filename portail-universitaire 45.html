<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>
      Université d’État de Tchétchénie nommée A. A. Kadyrov · Чеченский государственный университет имени А.
      А. Кадырова
    </title>
    <style>
      :root {
        --bg: #f6f4ef;
        --sf: #fff;
        --tx: #1d2330;
        --mu: #667085;
        --ac: #1f4e8c;
        --rd: #b3262d;
        --bd: #e3dfd6;
        --ok: #2e7d32;
        --wa: #b26a00;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #12161d;
          --sf: #1a202b;
          --tx: #e8ecf3;
          --mu: #97a1b3;
          --ac: #6ea2e6;
          --rd: #ef7a80;
          --bd: #2b3342;
          --ok: #6cc070;
          --wa: #e0a64a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #12161d;
        --sf: #1a202b;
        --tx: #e8ecf3;
        --mu: #97a1b3;
        --ac: #6ea2e6;
        --rd: #ef7a80;
        --bd: #2b3342;
        --ok: #6cc070;
        --wa: #e0a64a;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.5 Georgia,
          "Times New Roman",
          serif;
      }
      header {
        background: var(--ac);
        color: #fff;
        padding: 16px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      header small {
        opacity: 0.85;
        display: block;
        font-size: 13px;
      }
      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 8px 12px;
        background: var(--sf);
        border-bottom: 1px solid var(--bd);
      }
      nav button {
        white-space: nowrap;
      }
      button,
      select,
      input {
        font: inherit;
        color: var(--tx);
      }
      button {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button.on,
      button.pri {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .stat {
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 28px;
        color: var(--ac);
      }
      .mu {
        color: var(--mu);
        font-size: 14px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      h3 {
        margin: 14px 0 6px;
        font-size: 17px;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        margin: 4px 0 10px;
      }
      .w {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--bd);
        text-align: left;
      }
      th {
        color: var(--mu);
        font-weight: 600;
      }
      .bar {
        height: 8px;
        background: var(--bd);
        border-radius: 4px;
        min-width: 70px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: var(--ok);
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 12px;
        border: 1px solid var(--bd);
      }
      .ok {
        color: var(--ok);
      }
      .wa {
        color: var(--wa);
      }
      .rd {
        color: var(--rd);
      }
      .tag.ex {
        border-color: var(--ac);
        color: var(--ac);
        font-weight: 600;
      }
      .tag.za {
        border-color: var(--wa);
        color: var(--wa);
      }
      h4 {
        margin: 12px 0 4px;
        font-size: 14px;
      }
      .mat {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 18px;
        color: var(--rd);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      label {
        display: block;
      }
      td,
      th {
        font-variant-numeric: tabular-nums;
      }
      .alert {
        border-color: var(--rd);
      }
      .cover {
        min-height: 260px;
        display: flex;
        align-items: flex-end;
        padding: 20px 18px;
        color: #fff;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.65)),
          var(--cv, linear-gradient(135deg, #1f4e8c, #12306a));
        background-size: cover;
        background-position: center 62%;
      }
      .cover b {
        display: block;
        font-size: 22px;
      }
      .cover span {
        opacity: 0.9;
        font-size: 14px;
      }
      .ucx {
        --ucbg: #f3f4f6;
        display: grid;
        grid-template-columns: 260px 1fr;
        align-items: stretch;
        background: var(--ucbg);
        border: 1px solid var(--bd);
        border-radius: 6px;
        overflow: hidden;
        font:
          14px/1.45 "Segoe UI",
          "Open Sans",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: var(--tx);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .ucx {
          --ucbg: #12161d;
        }
      }
      :root[data-theme="dark"] .ucx {
        --ucbg: #12161d;
      }
      .ucx h2 {
        font: inherit;
        font-size: 18px;
      }
      .sb {
        background: var(--sf);
        border-right: 1px solid var(--bd);
        padding: 22px 0;
      }
      .sb .av {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: #fff;
        background: linear-gradient(135deg, #1f4e8c, #4aaed6);
      }
      .sb .nm {
        text-align: center;
        font-size: 16px;
        line-height: 1.3;
        padding: 0 10px 22px;
        border-bottom: 1px solid var(--bd);
        margin-bottom: 14px;
      }
      .sb .nm .mu {
        font-size: 12px;
        margin-top: 4px;
      }
      .sb button {
        display: flex;
        width: 100%;
        gap: 18px;
        align-items: center;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 0;
        padding: 15px 20px 15px 62px;
        font-size: 14px;
        color: var(--tx);
      }
      .sb button svg {
        width: 17px;
        height: 17px;
        flex: 0 0 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        color: #8a8f98;
      }
      .sb button.on,
      .sb button.on svg {
        color: #4aaed6;
      }
      .sb button:hover {
        background: rgba(74, 174, 214, 0.07);
      }
      .mn {
        padding: 20px 24px;
        min-width: 0;
      }
      .topb {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
        max-width: 760px;
      }
      .sr {
        position: relative;
        flex: 1;
        max-width: 532px;
      }
      .sr input {
        margin: 0;
        border: 0;
        border-radius: 4px;
        padding: 11px 40px 11px 18px;
        background: var(--sf);
        font-size: 14px;
      }
      .sr svg {
        position: absolute;
        right: 14px;
        top: 50%;
        margin-top: -8px;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: #9aa0a8;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .topb .ic {
        display: flex;
        gap: 6px;
      }
      .topb .ic button {
        background: none;
        border: 0;
        padding: 6px;
        color: #9aa0a8;
        border-radius: 50%;
        line-height: 0;
      }
      .topb .ic svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ucx .card {
        padding: 0;
        border-radius: 4px;
        overflow: hidden;
        max-width: 760px;
        margin-bottom: 16px;
      }
      .ucx .eh {
        background: #7ecbe6;
        color: #fff;
        padding: 20px 40px;
        margin: 0;
        border-radius: 0;
        font-size: 21px;
        font-weight: 300;
      }
      .cb {
        padding: 18px 40px;
      }
      .ev {
        display: flex;
        gap: 20px;
        padding: 26px 40px;
        border-bottom: 1px solid var(--bd);
        align-items: flex-start;
      }
      .ev:last-child {
        border-bottom: 0;
      }
      .ev .ea {
        flex: 0 0 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1f4e8c, #4aaed6);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 16px;
      }
      .ev .g {
        color: var(--mu);
      }
      .ev .tm {
        margin-top: 10px;
        font-size: 12px;
        color: var(--mu);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .pfr {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--bd);
      }
      .ucx .stat {
        padding: 8px;
      }
      .ucx textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        font: inherit;
        color: var(--tx);
        margin: 4px 0 10px;
      }
      .cal {
        table-layout: fixed;
        text-align: center;
      }
      .cal th,
      .cal td {
        text-align: center;
        padding: 2px;
        border: 0;
      }
      .cal button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 0;
        background: none;
        position: relative;
      }
      .cal .td {
        background: #4aaed6;
        color: #fff;
      }
      .cal .sel {
        outline: 2px solid #4aaed6;
      }
      .cal .dt::after {
        content: "";
        position: absolute;
        bottom: 4px;
        left: 50%;
        margin-left: -2px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--rd);
      }
      .dot {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #b8bcc4;
        border: 2px solid var(--sf);
      }
      .dot.on {
        background: #2fb344;
      }
      .thd {
        max-height: 260px;
        overflow: auto;
        padding: 8px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        margin: 8px 0;
        background: var(--bg);
      }
      .bb {
        max-width: 78%;
        padding: 7px 11px;
        border-radius: 12px;
        margin: 4px 0;
        background: var(--sf);
        border: 1px solid var(--bd);
      }
      .bb.out {
        margin-left: auto;
        background: #4aaed6;
        color: #fff;
        border-color: #4aaed6;
      }
      .bb small {
        display: block;
        opacity: 0.7;
        font-size: 11px;
      }
      .bdg {
        margin-left: auto;
        background: #d94b4b;
        color: #fff;
        border-radius: 10px;
        padding: 0 7px;
        font-size: 11px;
        line-height: 18px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(20px);
        background: #222;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 50;
        max-width: 90%;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%);
      }
      .pfe {
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 12px;
        margin: 8px 0;
      }
      .pfe a {
        word-break: break-all;
      }
      .chips {
        margin: 10px 0;
      }
      .chips button {
        margin: 2px 4px 2px 0;
        padding: 5px 10px;
        font-size: 13px;
      }
      .chips button.on {
        background: #4aaed6;
        color: #fff;
        border-color: #4aaed6;
      }
      @media print {
        .pfe .np,
        .chips {
          display: none;
        }
      }
      .att {
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 12px;
      }
      @media (max-width: 760px) {
        .ucx {
          grid-template-columns: 1fr;
        }
        .sb {
          display: flex;
          flex-wrap: wrap;
          padding: 12px;
          border-right: 0;
          border-bottom: 1px solid var(--bd);
        }
        .sb .av {
          margin: 0 12px 0 0;
          width: 56px;
          height: 56px;
          font-size: 20px;
        }
        .sb .nm {
          flex: 1;
          text-align: left;
          border: 0;
          margin: 0;
          padding: 0;
          align-self: center;
        }
        .sb button {
          width: auto;
          padding: 10px 12px;
          gap: 8px;
          font-size: 13px;
        }
        .mn {
          padding: 14px 10px;
        }
        .cb,
        .ev {
          padding-left: 16px;
          padding-right: 16px;
        }
        .ucx .eh {
          padding: 16px;
        }
      }
      @media print {
        .sb,
        .topb {
          display: none;
        }
        .ucx {
          display: block;
          border: 0;
        }
      }
      @media print {
        nav,
        header button,
        .np {
          display: none;
        }
      }
    </style>

                .map(
                  (x) =>
                    `<tr><td>${x.mat}</td><td>${esc(x.nom)}</td><td>${FAC[x.fac].c}${x.gr ? " · " + gr2(x.gr) : ""}</td><td>${x.st === "bud" ? "Бюджет" : "Контракт"}</td><td>${f1(moy(x))}</td><td>${prs(x) == null ? "—" : Math.round(prs(x)) + " %"}</td><td>${online(x) ? '<span class="ok">● В сети</span>' : "○"}</td></tr>`,
                )
                .join("");
          };
        q.oninput = dr;
        dr();
      }
      function seed() {
        const N = ["Ахмед Исаев", "Мариам Дудаева", "Хасан Умаров", "Зара Бекова", "Идрис Кадыров"],
          K = ["imt", "imt", "imt", "lec", "psy"];
        N.forEach((nm, i) => {
          const f = K[i % 5];
          const s = mk(
            nm,
            f,
            FAC[f].f[0],
            1 + (i % 4),
            FAC[f].gr ? FAC[f].gr[i % 3] : "",
            i % 2 ? "con" : "bud",
          );
          subj(f).forEach((m) => {
            s.g[m.n] = [0, 1, 2].map(() =>
              Math.min(5, Math.max(2, Math.round((3 + Math.random() * 2) * 2) / 2)),
            );
            s.p[m.n] = Math.round(55 + Math.random() * 45);
          });
          s.ev = subj(f)
            .slice(0, 4)
            .map((m, j) => ({
              t: Date.now() - (j + 1) * 129600000,
              k: j % 2 ? "p" : "g",
              m: m.n,
              v: s.g[m.n][0],
              by: "",
            }));
        });
        save();
      }
      function mk(nom, fac, fil, an, gr, st) {
        let m = "",
          t = 0;
        do {
          m = String(t < 500 ? 1000 + Math.floor(Math.random() * 9000) : 10000 + t - 500);
          t++;
        } while (db.students.some((x) => x.mat === m));
        const s = { mat: m, nom, fac, fil, an, gr: gr || "", st: st || "bud", g: {}, p: {} };
        db.students.push(s);
        return s;
      }
      function bind() {
        const on = (id, fn) => {
          const e = $(id);
          if (e) e.onclick = fn;
        };
        on("#demo", () => {
          seed();
          render();
        });
        on("#rst", () => {
          db.students = [];
          cur = null;
          save();
          render();
        });
        on("#rg", () => {
          const nm = $("#rn").value.trim(),
            mt = mnorm($("#rmt").value),
            f = $("#rf").value,
            fl = $("#rl").value,
            an = +$("#ra").value,
            gr = $("#rgp").value,
            st = $("#rsv").value,
            er = (t) => {
              $("#rm").textContent = t;
            };
          const nz = (t) => t.toLowerCase().replace(/\s+/g, " ").trim();
          const old = mt && db.students.find((x) => x.mat === mt);
          if (old) {
            if (!nm || nz(nm) !== nz(old.nom)) {
              er(
                "Ce matricule appartient à un étudiant enregistré : saisissez le nom complet associé à ce matricule pour vous réinscrire.",
              );
              return;
            }
            old.fac = f;
            old.fil = fl;
            old.an = an;
            old.gr = gr;
            old.st = st;
            save();
            cur = old.mat;
            view = "stu";
            msg = "";
            render();
            alert("Réinscription effectuée : " + old.mat);
            return;
          }
          if (mt && !/^\d{4,6}$/.test(mt)) {
            er("Format de matricule invalide : utilisez uniquement des chiffres, de 4 à 6 (exemple : 5654).");
            return;
          }
          if (!nm) {
            er("Veuillez saisir votre nom.");
            return;
          }
          const dup = db.students.find((x) => x.fac === f && nz(x.nom) === nz(nm));
          if (dup) {
            er(
              "Un étudiant portant ce nom est déjà inscrit dans cette sous-faculté (matricule " +
                dup.mat +
                "). Si c’est vous, saisissez ce matricule ; sinon, ajoutez une initiale ou un second prénom.",
            );
            return;
          }
          const s = mk(nm, f, fl, an, gr, st);
          if (mt) s.mat = mt;
          save();
          cur = s.mat;
          view = "stu";
          msg = "";
          render();
          alert("Votre matricule : " + s.mat);
        });
        on("#lg", () => {
          const v = mnorm($("#lm").value);
          if (db.students.some((x) => x.mat === v)) {
            cur = v;
            msg = "";
          } else msg = "Matricule introuvable.";
          render();
        });
        on("#out", () => {
          const s = db.students.find((x) => x.mat === cur);
          if (s) {
            s.on = false;
            s.seen = Date.now();
            save();
          }
          cur = null;
          sec = "ev";
          lastBeat = 0;
          render();
        });
        document.querySelectorAll(".sb button[data-sec]").forEach(
          (b) =>
            (b.onclick = () => {
              sec = b.dataset.sec;
              render();
            }),
        );
        const us = $("#us");
        if (us) {
          us.value = uq;
          us.oninput = () => {
            uq = us.value;
            if (sec !== "us") {
              sec = "us";
              render();
              const u = $("#us");
              u.focus();
              u.setSelectionRange(uq.length, uq.length);
            } else drawUsers();
          };
        }
        if (view === "stu" && sec === "us") drawUsers();
        on("#cp", () => {
          cm--;
          if (cm < 0) {
            cm = 11;
            cy--;
          }
          cdy = null;
          render();
        });
        on("#cn", () => {
          cm++;
          if (cm > 11) {
            cm = 0;
            cy++;
          }
          cdy = null;
          render();
        });
        on("#ct", () => {
          const n = new Date();
          cy = n.getFullYear();
          cm = n.getMonth();
          cdy = n.getDate();
          render();
        });
        document.querySelectorAll("[data-cd]").forEach(
          (b) =>
            (b.onclick = () => {
              cdy = +b.dataset.cd;
              render();
            }),
        );
        on("#tp", () => {
          sec = "st";
          render();
        });
        on("#ti", () => {
          sec = "sp";
          render();
        });
        on("#th", () =>
          alert(
            "Pour toute question, contactez la scolarité de votre faculté · По вопросам обращайтесь в деканат вашего факультета.",
          ),
        );
        on("#pa", () => {
          const s = db.students.find((x) => x.mat === cur);
          if (!s) return;
          const title = $("#pft").value.trim(),
            m = $("#pfm"),
            link = $("#pfl").value.trim();
          if (!title) {
            m.textContent = "Titre requis · Введите название";
            return;
          }
          if (link && !/^https?:\/\//i.test(link)) {
            m.textContent = "Le lien doit commencer par https:// · Ссылка должна начинаться с https://";
            return;
          }
          const rec = {
            cat: $("#pfc").value,
            title,
            d: $("#pfd").value || "",
            desc: $("#pfx").value.trim(),
            link,
            st: "wait",
          };
          s.pf = s.pf || [];
          if (pfe) {
            const i = s.pf.findIndex((e) => String(e.t) === pfe);
            if (i >= 0) s.pf[i] = Object.assign({}, rec, { t: s.pf[i].t });
            pfe = null;
          } else s.pf.push(Object.assign({}, rec, { t: Date.now() }));
          save();
          render();
        });
        on("#pq", () => {
          pfe = null;
          render();
        });
        document.querySelectorAll("[data-pd]").forEach(
          (b) =>
            (b.onclick = () => {
              const s = db.students.find((x) => x.mat === cur);
              if (s && confirm("Supprimer cette entrée ? · Удалить запись?")) {
                s.pf = (s.pf || []).filter((e) => String(e.t) !== b.dataset.pd);
                if (pfe === b.dataset.pd) pfe = null;
                save();
                render();
              }
            }),
        );
        document.querySelectorAll("[data-pe]").forEach(
          (b) =>
            (b.onclick = () => {
              pfe = b.dataset.pe;
              render();
            }),
        );
        document.querySelectorAll("[data-pf]").forEach(
          (b) =>
            (b.onclick = () => {
              pfc = b.dataset.pf;
              render();
            }),
        );
        on("#ms", () => {
          const s = db.students.find((x) => x.mat === cur),
            to = ($("#mt") || {}).value,
            t = $("#mx").value.trim();
          if (!s || !to || !t) return;
          const n = Date.now(),
            id = n + "-" + Math.random().toString(36).slice(2, 7);
          if (to === "*prof") {
            (s.msg = s.msg || []).push({ id, t: n, dir: "out", who: "Преподаватель", wm: "prof", x: t });
          } else {
            const r = db.students.find((x) => x.mat === to);
            if (!r) return;
            (r.msg = r.msg || []).push({ id, t: n, dir: "in", who: s.nom, wm: s.mat, x: t });
            (s.msg = s.msg || []).push({ id, t: n, dir: "out", who: r.nom, wm: r.mat, x: t });
          }
          save();
          sendLive({ id, t: n, to, nm: s.nom, wm: s.mat, x: t });
          $("#mx").value = "";
          drawThread();
        });
        on("#tms", () => {
          const r = db.students.find((x) => x.mat === $("#tmt").value),
            t = $("#tmx").value.trim();
          if (!r || !t) return;
          const n = Date.now(),
            id = n + "-" + Math.random().toString(36).slice(2, 7),
            nm = tName || "Преподаватель";
          (r.msg = r.msg || []).push({ id, t: n, dir: "in", who: nm, wm: "prof", x: t });
          save();
          sendLive({ id, t: n, to: r.mat, nm, wm: "prof", x: t });
          $("#tmx").value = "";
          note("Envoyé · Отправлено");
        });
        const mt = $("#mt");
        if (mt) {
          if (cto && [...mt.options].some((o) => o.value === cto)) mt.value = cto;
          mt.onchange = drawThread;
          drawThread();
        }
        if (view === "prof" && tOK) {
          drawOnline();
          drawTIn();
          drawPend();
        }
        on("#gs", () => {
          view = "stu";
          render();
        });
        on("#gp", () => {
          view = "prof";
          render();
        });
        on("#pl", async () => {
          let ok = false;
          try {
            ok = (await sha($("#pc").value)) === PH;
          } catch (e) {}
          tOK = ok;
          msg = ok ? "" : "Code incorrect.";
          render();
        });
        on("#po", () => {
          tOK = false;
          render();
        });
        on("#pu", () => {
          const s = db.students.find((x) => x.mat === $("#ps").value),
            m = $("#pm").value;
          if (s && s.g[m] && s.g[m].length) {
            const r = s.g[m].pop();
            save();
            msg = "Dernière note (" + r + ") annulée.";
            render();
          }
        });
        on("#pd", () => {
          const s = db.students.find((x) => x.mat === $("#ps").value);
          if (s && confirm("Supprimer " + s.nom + " (" + s.mat + ") ?")) {
            db.students = db.students.filter((x) => x !== s);
            save();
            msg = "Étudiant supprimé.";
            render();
          }
        });
        on("#pv", () => {
          const s = db.students.find((x) => x.mat === $("#ps").value);
          if (!s) {
            return;
          }
          const m = $("#pm").value,
            n = parseFloat($("#pn").value),
            p = parseInt($("#pp").value);
          tName = $("#pt").value.trim();
          const ev = (s.ev = s.ev || []);
          if (!isNaN(n) && n >= 0 && n <= 5) {
            (s.g[m] = s.g[m] || []).push(n);
            ev.push({ t: Date.now(), k: "g", m, v: n, by: tName });
          }
          if (!isNaN(p) && p >= 0 && p <= 100) {
            s.p[m] = p;
            ev.push({ t: Date.now(), k: "p", m, by: tName });
          }
          save();
          msg = "Enregistré pour " + s.nom + ".";
          render();
        });
        on("#ap", () => {
          const t = $("#at").value.trim();
          if (t) {
            db.ann.unshift({ d: new Date().toISOString().slice(0, 10), t });
            save();
            msg = "Annonce publiée.";
            render();
          }
        });
        const qf = $("#qf");
        if (qf)
          qf.oninput = () => {
            const v = qf.value.toLowerCase();
            document
              .querySelectorAll("#app .card")
              .forEach((c) => (c.style.display = c.textContent.toLowerCase().includes(v) ? "" : "none"));
          };
        fillFil();
        fillProf();
      }
      function facs() {
        if (tOK) return facsAll();
        const s = db.students.find((x) => x.mat === cur);
        if (s && FAC[s.fac]) {
          const x = FAC[s.fac];
          return `<div class="card"><h2>${x.ru}</h2><p class="mu">Направления : ${x.f.join(" · ")} · ${x.m.filter((q) => q[2] === "ex").length} экзамена · ${x.m.filter((q) => q[2] === "za").length} зачётов</p>${FT(s.fac)}</div>`;
        }
        return `<div class="card"><h2>Accès réservé · Доступ ограничен</h2><p class="mu">Le détail des facultés est visible après connexion : chaque étudiant voit sa propre faculté, les enseignants voient toutes les facultés.</p><button id="gs" class="pri">Espace étudiant</button> <button id="gp">Espace enseignant</button></div>`;
      }
      function render() {
        beat();
        announce();
        nav();
        $("#app").innerHTML = { home, fac: facs, reg, stu, prof }[view]();
        bind();
      }
      $("#th").onclick = () => {
        const r = document.documentElement;
        const dark = r.dataset.theme
          ? r.dataset.theme === "dark"
          : matchMedia("(prefers-color-scheme:dark)").matches;
        r.dataset.theme = dark ? "light" : "dark";
      };
      render();
      if (window.claude && window.claude.use) startRoom();
      if (window.claude && window.claude.use)
        startSync().catch(() => stat("Données enregistrées sur cet appareil uniquement"));
      setInterval(() => {
        beat();
        if (view === "stu" && sec === "us") drawUsers();
      }, 30000);
    </script>
  </body>
</html>
